[project]
name = "adaptive-screen-agent"
version = "0.2.0"
description = "Application-agnostic visual state discovery and verified action learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mss>=9.0.1",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
benchmark = ["playwright==1.63.0"]

[project.scripts]
adaptive-loop = "loop.__main__:main"

[tool.setuptools.packages.find]
include = ["loop*", "benchmarks*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not benchmark and not native_input"]
testpaths = ["tests", "benchmarks/infinite_mario/tests"]
pythonpath = ["."]
markers = [
    "benchmark: needs PlayJev cache, Chromium, and Playwright (deselected by default)",
    "native_input: sends real Win32 input to an instrumented window (deselected by default)",
]
