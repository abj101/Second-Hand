[project]
name = "adaptive-screen-agent"
version = "0.2.0"
description = "Application-agnostic visual state discovery and verified action learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "pyboy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-xdist>=3.6"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["briefs/*.json"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-n", "auto"]
testpaths = ["tests"]
pythonpath = ["."]
