# Phase 2 experiment config. Change one independent variable at a time.
# Vision model locked after quant matrix + peer comparison (writeups/07-quant-matrix.md).
# Live path: single VLM planner. Default eyes: qwen3.5:4b-q4_K_M (think: false).
# Toggle Ollama Cloud VL: --model gemma4:31b-cloud
# two_stage LLM1-only cloud: python -m loop collect --architecture two_stage --cloud
# Dual-brain is legacy --dual-brain.
# 2048 has choose_swipe; Tetris has place_piece; StS/Platinum stay empty.

n_micro: 20
temperature: 0.7
max_tokens: 1024
max_actions_per_cycle: 5
constructor_max_rewrites: 3
constructor_soft_cap_skills: 8
pause_and_decide: true
prompt_mode: pixels  # pixels | manual  (manual is a late Analyze-experiment ablation)
# STS2 uses the unknown-first dual-agent path by default. The CLI's
# --architecture overlay flag remains an explicit legacy ablation.
architecture: two_stage  # two_stage | overlay (overlay is an ablation)

capture:
  longest_side: [native, 768, 512]  # See sweep (Playwright). Harness uses default_* / fixture capture.
  jpeg_quality: [85, 70]
  format: jpeg
  cadence_discrete: before_after
  cadence_hold_seconds: 2.0
  default_longest_side: 768
  default_jpeg_quality: 85
  scout_every: 8
  scout_longest_side: 384
  settle_timeout_ms: 400
  settle_stable_ms: 50
  settle_poll_ms: 16
  force_every: 8
  diff_size: 64
  diff_threshold: 0.02
  layout: cv
  layout_pad: [0.04, 0.04, 0.04, 0.04]
  layout_sides: [256, 384, 512, 768]
  layout_iou_refresh: 0.7

ollama:
  num_ctx: 4096
  brain_num_ctx: 2048
  keep_alive: 5m

models:
  # Single-VLM planner. In use: qwen3.5:4b-q4_K_M (think:false at /api/chat).
  # Toggle full cloud: --model gemma4:31b-cloud
  # two_stage LLM1-only: --cloud (perceive=gemma4:31b-cloud, reasoner stays local)
  # Pull: python scripts/pull_local_vlms.py
  # Do not use bare qwen3.5:4b — thinking-only, empty JSON under max_tokens=1024.
  local:
    - id: qwen3.5:4b-q4_K_M
      provider: ollama
      note: official Qwen 3.5 4B Q4; current single-VLM planner
  cloud:
    - id: gemma4:31b-cloud
      provider: ollama
      note: default cloud VL; free tier, low usage, native vision
    # Other free-tier vision-capable cloud models to try with --model:
    # - gemma4:cloud          (alias of 31b-cloud)
    # - gemma3:4b-cloud       (retiring → gemma4; low usage)
    # Text-only free cloud (no screenshots — not for See/Act):
    # - gpt-oss:20b-cloud     (low usage, fast)
    # - nemotron-3-nano:30b-cloud
  locked:
    - id: qwen3.5:4b-q4_K_M
      provider: ollama
      role: eyes
    # Legacy Phase 1 text planner. Unused unless --dual-brain.
    - id: qwen3.5:4b-q4_K_M
      provider: ollama
      role: brain
      fallback: phi4-mini
      num_ctx: 2048
  brain_candidates:
    - qwen3.5:4b-q4_K_M
    - phi4-mini

fixtures:
  "2048":
    kind: browser
    path: games/2048/index.html
    paused: false
    action_table: swipe
    window_title: "2048"
    capture:
      longest_side: 512
      jpeg_quality: 85
      diff_threshold: 0.012
      scout_every: 12
      settle_timeout_ms: 400
      # Vision-only. Tune against a headed client grab. Mouse stays full-client.
      presets:
        gameplay:
          crop: [0.12, 0.20, 0.76, 0.58]
          longest_side: 512
        ui:
          crop: null
          longest_side: 768
  tetris:
    kind: browser
    path: games/tetris/index.html
    paused: true
    action_table: tetris
    window_title: "Tetris"
    capture:
      longest_side: 768
      jpeg_quality: 85
      diff_threshold: 0.004
      scout_every: 8
      settle_timeout_ms: 400
      presets:
        gameplay:
          crop: [0.14, 0.02, 0.72, 0.94]
          longest_side: 768
        ui:
          crop: null
          longest_side: 768
  platinum:
    kind: emulator
    window_title: melonDS
    paused: false
    action_table: nds
    notes: user-owned ROM only; never in git
    capture:
      longest_side: 768
      crop: null
      scout_every: 8
      presets:
        gameplay:
          crop: null
          longest_side: 768
        ui:
          crop: null
          longest_side: 768
  sts:
    kind: commercial
    window_title: Slay the Spire
    paused: false
    action_table: sts
    capture:
      longest_side: 768
      crop: null
      scout_every: 8
      presets:
        gameplay:
          crop: null
          longest_side: 768
        ui:
          crop: null
          longest_side: 768

run_tags_required:
  - harness_level
  - fixture
  - model
  - paused
  - prompt_mode
  - skills
  - gsm
  - state_source
  - gsm_kind
  - opt_iter

# Phase 2 GSM (writeups/08-gsm.md). Sequential VRAM: PLAN / DETECT / TRAIN.
# Claimed extracted arm: detector grounding-dino (when it loads). pixel-blob is the
# G5 pixels fallback via CLI `--detector pixel-blob`, not the claimed extracted arm.
# 2048 choose_swipe + Tetris place_piece. StS / Platinum stay empty.
gsm:
  planner: single
  max_opt_iters: 3
  sandbox: true
  retrieve_threshold: 0.85
  detector: grounding-dino  # grounding-dino | pixel-blob | fake
  detector_device: cpu  # cpu coexists with Ollama; cuda must unload the VLM first
  cursor_window_title: Cursor  # title substring when --in-cursor (matches "Cursor Agents")
  default_state_source: extracted  # extracted | pixels (G5 ablation)
  fixtures:
    "2048":
      - name: choose_swipe
        kind: rule
        recognize: "tiles can slide; pack toward the bottom-left corner"
        end: "after one swipe or game over"
        enabled: true
        state_source: extracted
        detector_family: grounding-dino
        action_space: [swipe_down, swipe_left, swipe_up, swipe_right]
        labels: [tile]
    tetris:
      - name: place_piece
        kind: rule
        recognize: "active tetromino needs placement before lock"
        end: "piece locked or game over or timeout"
        enabled: true
        state_source: extracted
        detector_family: grounding-dino
        action_space: [shift_left, shift_right, rotate, hard_drop]
    platinum: []
    sts: []
    elden:
      - name: explore
        kind: rule
        recognize: "stall or unknown heading; look then walk"
        end: "prompt visible, fail screen, or tick cap"
        enabled: true
        state_source: pixels
        action_space: [stick_r_e, stick_r_w, stick_l_s, stick_l_n]
